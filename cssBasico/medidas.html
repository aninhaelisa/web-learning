<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medidas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .p1{
            font-size: 1em;
            background-color: royalblue;
        }

        .f1 {
            border: 5px solid rgb(137, 0, 190);
            padding: 10px;
            margin: 1em 0;
            background-color: rgb(255, 175, 248);
        }

        .px {
            width: 200px;
        }

        .vw {
            width: 10vw;
        }

        .em {
            width: 10em;
        }
    </style>

    <!--MEDIDAS EM CSS-->
    <div class="p1">
        <div class="f1 px">DIV FILHO 1 px</div>
        <div class="f1 vw">DIV FILHO 1 vw</div>
        <div class="f1 em">DIV FILHO 1 em</div>
    </div>

</body>

</html>
