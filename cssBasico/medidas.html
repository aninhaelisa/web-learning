<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medidas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 16px; /*1 rem = 16px*/
            color: #fff;

            flex-wrap: wrap;
        }

        .p {
            font-size: 1em;
            background-color: royalblue;
            margin-left: 1%; /*Esse elemento tem 226px de altura, sendo assim, terá 2.26px de margin, que é: [226 x 0.01]*/
        }

        /*DIV FILHO 1*/
        .f1 {
            border: 5px solid rgb(137, 0, 190);
            padding: 10px;
            margin: 1em 0;
            background-color: rgb(255, 175, 248);
            color: black;
        }

        .px {
            width: 200px;
        }

        .vw {
            width: 10vw;
        }

        .em {
            width: 10em;
        }

        /*LISTAS*/
        .ems{
            background-color: rgba(96, 191, 255, 0.438);
        }

        .ems li {
            font-size: 1.3em; /**/
        }

        .rems{
            margin-left: 5%;
            background: rgba(255, 166, 0, 0.363);
        }

        .rems li {
            font-size: 1.3rem; /*equivale a 20.8px [1.3 x 16px]*/
        }


        /*PORCENTAGEM EM DIV*/
        .p2{

            width: 400px;
            height: 200px;

            background-color: rgb(129, 83, 255);
            margin-right: 1em;
            color: black;

            display: flex;
            justify-content: center;
            text-align: center;
            align-items: center;
        }
        .f2 {
            width: 60%; /*60% de 400px*/
            height: 40%; /*40% de 200px*/
            background: pink;
        }

        .percent{
            background-color: rgb(255, 143, 143);
            width: 20%; /*20% em relação a quantidade de px de width da tela*/
            height: 30%; /*30% em relação a quantidade de px de height da tela*/
            color: #000;

            display: flex;
            align-items: center;
            text-align: center;
            justify-content: center;
        }


    </style>

    <!--MEDIDAS EM CSS-->

    <ul class="ems">
        <li>One</li>
        <li>Two</li>
        <li>
            Three
            <ul>
                <li>Three A</li>
                <li>
                    Three B
                    <ul>
                        <li>Three B 2</li>
                    </ul>
                </li>
            </ul>
        </li>
    </ul>

    <ul class="rems">
        <li>One</li>
        <li>Two</li>
        <li>
            Three
            <ul>
                <li>Three A</li>
                <li>
                    Three B
                    <ul>
                        <li>Three B 2</li>
                    </ul>
                </li>
            </ul>
        </li>
    </ul>

    <div class="p">
        <div class="f1 px">DIV FILHO 1 px</div>
        <div class="f1 vw">DIV FILHO 1 vw</div>
        <div class="f1 em">DIV FILHO 1 em</div>
    </div>

    <div class="p p2">
        <div class="f2">DIV FILHO 2 %</div>
    </div>

    <div class="percent">
        porcentagem sem pai
    </div>
</body>

</html>
