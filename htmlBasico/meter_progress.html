<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METER E PROGRESS</title>
</head>

<body>

    <h1>Meter</h1>
    <meter min="0" max="100" low="30" high="90" value="40" optimum="50"></meter>

    <h1>Progress</h1>
    <label>
        Porcentagem da tarefa
        <progress max="100" value="50">50%</progress>
    </label>

    <form oninput="result.value=parseInt(idadeA.value)*parseInt(idadeB.value)">
        <input type="number" name="idadeA" placeholder="Idade" required id="idadeA" min="10" max="100"> x
        <input type="number" name="idadeB" placeholder="Idade" required id="idadeB" min="10" max="100"> =
        <output name="result" for="idadeA idadeB"></output>
    </form>

</body>

</html>
