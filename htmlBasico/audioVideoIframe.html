<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audios</title>
</head>
<body style="min-height: 100vh; display: flex; justify-content: center; align-items: center; flex-direction: column;">

    <audio controls autoplay loop>
        <source src="src/audios/audio1.mp3" type="audio/mp3">
        <source src="src/audios/audio2.mp3" type="audio/mp3">
        <source src="src/audios/audio3.mp3" type="audio/mp3">
    </audio>
    <video controls autoplay muted loop style="width: 100px; height: auto;">
        <source src="src/videos/video1.mp4" type="video/mp4">
    </video>
    <iframe src="https://serliv.com" width="200px" height="auto"></iframe>
</body>
</html>
